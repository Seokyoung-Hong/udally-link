# 유달리에 내 PC로 연결하는 모드(포트를 열지 않음). 기기 인증 주소·코드는 docker compose logs -f stt
#   docker compose -f compose.yaml -f compose.link.yaml up -d            # GPU면 compose.cuda.yaml 등을 함께
services:
  stt:
    command: ["connect"]
    ports: !reset []
    environment:
      UDALLY_URL: ${UDALLY_URL:-https://udally.sio2.kr}
