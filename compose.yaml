# 기본(CPU):  docker compose up -d --build
# GPU:        docker compose -f compose.yaml -f compose.cuda.yaml up -d --build
# 모델은 기동 때 받지 않습니다. 유달리 설정 화면 [적용](POST /v1/models/{id})이 받기를 시작합니다.
# 프로젝트 이름을 고정한다(폴더 이름과 무관하게 볼륨이 udally-link_models). 옛 udally-stt_models를 이어 쓰려면 README 0절.
name: udally-link
services:
  link:
    build: .
    image: udally-link:cpu
    restart: unless-stopped
    ports:
      - "${LINK_BIND:-${STT_BIND:-127.0.0.1}}:${LINK_PORT:-${STT_PORT:-8000}}:8000" # 옛 STT_* 이름도 읽는다
    env_file:
      - path: .env # LINK_API_KEY 등. .env.example 참고
        required: false
    environment:
      LINK_PORT: "8000" # 컨테이너 안 포트는 고정(.env의 LINK_PORT는 호스트 포트)
    volumes:
      - models:/cache # 받은 모델이 남는 곳(컨테이너를 지워도 유지)

volumes:
  models:
